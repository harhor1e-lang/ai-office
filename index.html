<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10152a">
<meta name="description" content="ALI AI PLATFORM">
<title>ALI AI PLATFORM</title>
<style>
:root{color-scheme:dark;--mint:#24c9aa;--violet:#7865ff;--coral:#ff8b80}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif;background:#10152a;color:#fff}
.splash{position:fixed;inset:0;display:grid;place-items:center;isolation:isolate;overflow:hidden;
background:radial-gradient(ellipse at 50% 43%,#292750 0%,#1a1d3b 38%,#10152a 76%)}
.aurora{position:absolute;width:min(82vw,760px);aspect-ratio:1;border-radius:50%;filter:blur(1px);
background:conic-gradient(from 30deg,transparent 0 13%,#24c9aa30 20%,transparent 31%,#7865ff35 47%,transparent 60%,#ff8b8025 78%,transparent 90%);
animation:spin 12s linear infinite;z-index:-1}
.ring{position:absolute;width:min(72vw,590px);aspect-ratio:1;border:1px solid #ffffff12;border-radius:50%;
box-shadow:0 0 90px #7865ff12,inset 0 0 90px #24c9aa0a;animation:breathe 3.8s ease-in-out infinite}
.ring.two{width:min(54vw,430px);border-style:dashed;animation:spin 28s linear infinite}
.ring.three{width:min(92vw,760px);border-color:#24c9aa14;animation:breathe 4.6s ease-in-out infinite reverse}
.content{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px;animation:appear 1s cubic-bezier(.2,.8,.2,1) both}
.logo{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;
background:linear-gradient(145deg,#ffffff1c,#ffffff06);border:1px solid #ffffff35;
box-shadow:0 20px 70px #7865ff35,inset 0 1px #ffffff55;backdrop-filter:blur(18px);margin-bottom:30px}
.logo svg{width:68px;height:68px;filter:drop-shadow(0 5px 15px #7865ff55)}
h1{margin:0;font-size:clamp(32px,7vw,66px);font-weight:850;letter-spacing:-1.8px;
background:linear-gradient(100deg,#fff 8%,#b9fff0 42%,#c7bdff 76%,#ffd1c9);
-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin-top:14px;font-size:clamp(9px,1.6vw,12px);letter-spacing:clamp(2px,.6vw,5px);color:#b8bfdc;direction:ltr}
.loader{width:min(230px,55vw);height:2px;margin-top:48px;background:#ffffff18;border-radius:20px;overflow:hidden}
.loader:after{content:"";display:block;width:100%;height:100%;transform:scaleX(0);transform-origin:right;
background:linear-gradient(90deg,var(--mint),var(--violet),var(--coral));animation:load 5s linear forwards}
@keyframes load{to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.96);opacity:.42}50%{transform:scale(1.04);opacity:.9}}
@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.aurora,.ring,.content,.loader:after{animation-duration:5s}}
</style>
</head>
<body>
<main class="splash" aria-label="ALI AI PLATFORM">
<div class="aurora"></div><div class="ring"></div><div class="ring two"></div><div class="ring three"></div>
<div class="content">
<div class="logo" aria-hidden="true">
<svg viewBox="0 0 64 64" fill="none">
<defs><linearGradient id="mark" x1="9" y1="56" x2="55" y2="8" gradientUnits="userSpaceOnUse"><stop stop-color="#24c9aa"/><stop offset=".53" stop-color="#7865ff"/><stop offset="1" stop-color="#ff8b80"/></linearGradient></defs>
<path d="M32 7 55 50H44L32 27 20 50H9L32 7Z" fill="url(#mark)"/>
<path d="M23 40h18" stroke="white" stroke-width="4" stroke-linecap="round"/>
<circle cx="32" cy="55" r="3" fill="white"/>
</svg>
</div>
<h1>ALI AI PLATFORM</h1>
<div class="tag">THINK · CREATE · BUILD</div>
<div class="loader" aria-hidden="true"></div>
</div>
</main>
<script>
(() => {
  const destination = new URL("./platform.html", window.location.href);
  destination.search = window.location.search;
  destination.hash = window.location.hash;
  window.setTimeout(() => window.location.replace(destination.href), 5000);
})();
</script>
</body>
</html>
